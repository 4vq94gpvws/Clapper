[project]
name = "clapper-mcp"
version = "0.1.0"
description = "MCP server that lets an AI agent make videos: Remotion and Blender renders, voice-over, captions, stock images and versioned review comments."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["mcp", "mcp-server", "video", "remotion", "blender", "codex", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.12,<2",
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
clapper = "clapper.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clapper"]
include = ["src/clapper/**"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# Normally you do not copy this by hand:
#   docker run --rm ghcr.io/OWNER/clapper:latest --print-config codex >> ~/.codex/config.toml
# This is what that prints. `codex mcp get clapper` (codex-cli 0.172.0) reads these keys.

[mcp_servers.clapper]
command = "docker"
args = ["run", "-i", "--rm", "--cap-drop=ALL", "--security-opt=no-new-privileges", "-v", "clapper-work:/work", "-e", "GROQ_API_KEY", "-e", "PEXELS_API_KEY", "-e", "UNSPLASH_ACCESS_KEY", "ghcr.io/OWNER/clapper:latest"]
env_vars = ["GROQ_API_KEY", "PEXELS_API_KEY", "UNSPLASH_ACCESS_KEY"]
startup_timeout_sec = 120
tool_timeout_sec = 600

# HTTP mode instead (docker compose up -d):
# [mcp_servers.clapper]
# url = "http://127.0.0.1:8770/mcp"
# bearer_token_env_var = "CLAPPER_TOKEN"
